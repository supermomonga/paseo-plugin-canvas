name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # pretypecheck generates the renderer modules that the tests import.
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      # Packs the plugin, installs it like Paseo's npm acquisition and compiles
      # it with Paseo's compiler (ADR 14).
      - name: Check npm installation
        run: npm run test:package
