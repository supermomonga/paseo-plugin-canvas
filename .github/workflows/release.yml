name: Release

# When a push to main changes the version in package.json, tags it, publishes
# the plugin to npm with trusted publishing (OIDC, no token) and creates a
# GitHub release (ADR 14).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect and tag new version
        id: new-version
        uses: salsify/action-detect-and-tag-new-version@b1778166f13188a9d478e2d1198f993011ba9864 # v2.0.3
        with:
          version-command: node -p "require('./package.json').version"

      # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later.
      - if: steps.new-version.outputs.tag != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # prepack bundles the renderer modules from development dependencies.
      # Their install scripts are not needed for that.
      - name: Install dependencies
        if: steps.new-version.outputs.tag != ''
        run: npm ci --ignore-scripts

      # prepack also drops the Git-only build commands from paseo-plugin.json.
      - name: Publish to npm
        if: steps.new-version.outputs.tag != ''
        run: npm publish

      - name: Create GitHub release
        if: steps.new-version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.new-version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
